  <title>LollyFx Luminari</title>
  <style>
    body {

  background-image: url('images/ROBO.JPG');
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

	  
	  
	
    header {
      background: #EAEEF;
      color: navy;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 32px;
    }
    nav {
      display: flex;
      gap: 24px;
      font-weight: 600;
      font-size: 18px;
    }
    nav a {
      color: black;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #FF9800;
    }
    .search-bar {
      margin-left: 20px;
      flex-grow: 1;
      max-width: 300px;
    }
    .search-bar input[type="search"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
      border: none;
      font-size: 16px;
    }
    main {
      padding: 40px;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }
    main h2 {
      font-size: 48px;
      margin-bottom: 8px;
      color: #748DAE;
      font-weight: 700;
    }
    main em {
      font-size: 20px;
      color: #320A6B;
      display: block;
      margin-bottom: 30px;
    }
    main p.slogan {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 30px;
      color: #1B3C53;
    }
    main p.description {
      font-size: 18px;
      max-width: 700px;
      margin: 0 auto 40px;
      color: #000000;
    }
    .cta-button {
      background-color: #CFFE2;
      color: blue;
      border: none;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .cta-button:hover {
      background-color: #000000;
    }
    .features {
      margin-top: 60px;
      text-align: left;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    .features h3 {
      font-size: 28px;
      color: #465C88;
      margin-bottom: 20px;
      font-weight: 700;
      text-align: center;
    }
    .features ul {
      list-style-type: disc;
      padding-left: 20px;
      font-size: 18px;
      color: #465C88;
    }
    .features ul li {
      margin-bottom: 12px;
    }
    footer {
      margin-top: 80px;
      padding: 20px;
      background: #333333;
      color: white;
      text-align: center;
      font-size: 14px;
    }
